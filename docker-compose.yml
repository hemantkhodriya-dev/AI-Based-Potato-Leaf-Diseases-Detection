version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: potatocare-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_DIR=./models
      - CALIBRATION_TEMPERATURE=4.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potatocare-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/potatocare}
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: potatocare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
